name: ClipMesh

options:
  deploymentTarget:
    iOS: "26.0"
  groupSortPosition: top

settings:
  base:
    CLANG_WARN_DOCUMENTATION_COMMENTS: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: Z7R59J7QV8
    ENABLE_STRICT_OBJC_MSGSEND: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_VERSION: 6.2

targets:
  ClipMesh:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - App/Info.plist
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: 1
        INFOPLIST_FILE: Sources/App/Info.plist
        MARKETING_VERSION: 0.1.2
        PRODUCT_BUNDLE_IDENTIFIER: co.clicketyclacks.ClipMesh
        PRODUCT_NAME: ClipMesh
        TARGETED_DEVICE_FAMILY: "1,2"

  ClipMeshTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes:
          - Fixtures
      - path: Tests/Fixtures
        buildPhase: resources
      - path: ../../fixtures/protocol/publish-v1.json
        buildPhase: resources
    dependencies:
      - target: ClipMesh
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: co.clicketyclacks.ClipMeshTests
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ClipMesh.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/ClipMesh"
        BUNDLE_LOADER: "$(TEST_HOST)"

  ClipMeshUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: ClipMesh
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: co.clicketyclacks.ClipMeshUITests
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated

schemes:
  ClipMesh:
    build:
      targets:
        ClipMesh: all
        ClipMeshTests: [test]
        ClipMeshUITests: [test]
    test:
      gatherCoverageData: true
      environmentVariables:
        CLIPMESH_TEST_HUB_URL: "$(CLIPMESH_TEST_HUB_URL)"
      targets:
        - ClipMeshTests
        - ClipMeshUITests
