[package]
name = "clipmesh-agent-linux"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
clipmesh-agent-core = { path = "../clipmesh-agent-core", version = "0.1.0" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[target.'cfg(target_os = "linux")'.dependencies]
os_pipe = "1"
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wl-clipboard-rs = "0.9"
zbus = "4"

[dev-dependencies]
tempfile = "3"
