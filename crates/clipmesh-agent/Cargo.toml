[package]
name = "clipmesh-agent"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
clipmesh-agent-core = { path = "../clipmesh-agent-core", version = "0.1.0" }
clipmesh-protocol = { path = "../clipmesh-protocol", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
clipmesh-agent-linux = { path = "../clipmesh-agent-linux", version = "0.1.0" }

[target.'cfg(target_os = "macos")'.dependencies]
clipmesh-agent-macos = { path = "../clipmesh-agent-macos", version = "0.1.0" }

[dev-dependencies]
tempfile = "3"
